<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon-Game</title>
    <link rel="stylesheet" href="simon.css">
</head>
<body>
    <!-- <H1>Simon Says Game</H1>
    <h2>Play any key to start game</h2> -->
    <h1>Simon Says Game</h1>
<h2>Press Start to Play</h2>

<button id="startBtn">Start Game</button>
    <div class="btn-container">
        <div class="line-one">
            <div class="btn pink " type="button" id="pink">1</div>
             <div class="btn purple" type="button" id="purple">2</div>
    </div>
        
       <div class="line-two">
         <div class="btn orange" type="button" id="orange">3</div>
        <div class="btn red" type="button" id="red">4</div>
       </div>
    </div>
    <script src="simon.js"></script>
</body>
</html>
